<script type="module">

import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

// ================= UTILS =================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));

let GOD=false;
const pad=(n,l=6)=>String(Math.floor(n)).padStart(l,'0');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ================= INPUT =================
const keys={};
const inp={dx:0,dy:0,has:false};
let onAnyKey=null;
const DIRK={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(DIRK[e.code]){ inp.dx=DIRK[e.code][0]; inp.dy=DIRK[e.code][1]; inp.has=true; }

addEventListener('keyup',e=>{keys[e.code]=false});

const ptr={down:false,id:null,lx:0,ly:0,ax:0,ay:0};

  if(onAnyKey) onAnyKey({code:'Pointer',pointer:true});

  ptr.ax+=e.clientX-ptr.lx; ptr.ay+=e.clientY-ptr.ly; ptr.lx=e.clientX; ptr.ly=e.clientY;
  const th=20;
  if(Math.abs(ptr.ax)>th||Math.abs(ptr.ay)>th){
    if(Math.abs(ptr.ax)>Math.abs(ptr.ay)){ inp.dx=Math.sign(ptr.ax); inp.dy=0; } else { inp.dx=0; inp.dy=Math.sign(ptr.ay); }
    inp.has=true; ptr.ax=0; ptr.ay=0; ptr.moved=true;
  }
},{passive:true});
let onTap=null;
const ptrUp=e=>{ if(e.pointerId===ptr.id){ptr.down=false;ptr.id=null; if(!ptr.moved&&e.type==='pointerup'&&performance.now()-ptr.downT<230&&onTap&&!(e.target.closest&&e.target.closest('button'))) onTap();} };
addEventListener('pointerup',ptrUp); addEventListener('pointercancel',ptrUp);

// ================= AUDIO =================
let AC=null,master,sfxG,musG,noiseBuf,muted=false;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(AC.destination);
  master=AC.createGain(); master.gain.value=muted?0:.7; master.connect(comp);
  sfxG=AC.createGain(); sfxG.gain.value=.8; sfxG.connect(master);
  musG=AC.createGain(); musG.gain.value=.42; musG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  music.next=AC.currentTime+.1;
}
function setMute(m){ muted=m; if(master) master.gain.setTargetAtTime(m?0:.7,AC.currentTime,.02); $('mute').textContent='M · SOUND '+(m?'OFF':'ON'); }
function tone(o){
  if(!AC) return; const t=o.t??AC.currentTime, d=o.d??.1;
  const os=AC.createOscillator(), g=AC.createGain();
  os.type=o.type||'square'; os.frequency.setValueAtTime(o.f||440,t);
  if(o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.sweep??d));
  if(o.det) os.detune.value=o.det;

  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  let node=os;
  if(o.lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; f.Q.value=o.q??1; os.connect(f); node=f; }

  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=o.ft||'lowpass'; f.frequency.setValueAtTime(o.f||2000,t); f.Q.value=o.q??1;
  if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+d);

  s.connect(f); f.connect(g); g.connect(o.dest||sfxG); s.start(t,Math.random()); s.stop(t+d+.05);
}
const now=()=>AC?AC.currentTime:0;
let munchAlt=0;
const SFX={
  munch(){ munchAlt^=1; tone({f:munchAlt?660:495,f2:munchAlt?330:250,d:.07,v:.055,type:'triangle'}); },
  crunch(){ noise({f:2600,f2:500,d:.08,v:.09,ft:'bandpass',q:1.5}); tone({f:180,f2:90,d:.07,v:.06,type:'square',lp:900}); },
  power(){ const t=now(); [392,523,659,784,1046].forEach((f,i)=>tone({f,d:.12,v:.07,t:t+i*.05,type:'square',lp:3000})); },
  eatEnemy(){ tone({f:180,f2:1800,d:.28,v:.09,type:'square',lp:4000}); noise({f:6000,f2:1500,d:.15,v:.06,ft:'highpass'}); },
  die(){ const t=now(); for(let i=0;i<10;i++) tone({f:900-i*75,f2:700-i*70,d:.1,v:.07,t:t+i*.09,type:'square',lp:2500}); noise({f:900,f2:60,d:1.1,v:.15,t:t+.85}); },
  ready(){ const t=now(); const M=[[72,.12],[79,.12],[76,.12],[84,.24],[83,.12],[79,.12],[76,.24],[74,.12],[77,.12],[81,.12],[86,.36]];
    let tt=t; M.forEach(([n,d])=>{ const f=440*Math.pow(2,(n-69)/12); tone({f,d:d*.9,v:.07,t:tt,type:'square',lp:3200}); tone({f:f/4,d:d*.9,v:.06,t:tt,type:'triangle'}); tt+=d; }); },
  glitch(){ noise({f:rand(800,6000),d:rand(.04,.12),v:.07,ft:'bandpass',q:4}); },
  alarm(){ const t=now(); for(let i=0;i<4;i++){ tone({f:880,d:.18,v:.08,t:t+i*.4,type:'sawtooth',lp:2400}); tone({f:660,d:.18,v:.08,t:t+i*.4+.2,type:'sawtooth',lp:2400}); } },
  boom(big){ noise({f:big?2400:3600,f2:60,d:big?1.4:.45,v:big?.45:.25}); tone({f:big?130:180,f2:30,d:big?.9:.3,v:big?.4:.22,type:'sine'}); },
  hurt(){ noise({f:900,f2:60,d:.5,v:.35}); tone({f:220,f2:40,d:.45,v:.25,type:'sawtooth',lp:1200}); },
  turbo(){ tone({f:200,f2:1400,d:.35,v:.07,type:'sawtooth',lp:3000}); },
  warn(){ tone({f:1200,d:.06,v:.05,type:'square'}); },
  laser(){ tone({f:1600,f2:120,d:.5,v:.07,type:'sawtooth',lp:3000}); noise({f:4000,f2:300,d:.5,v:.08}); },
  shot(){ tone({f:900,f2:300,d:.08,v:.025,type:'square',lp:2500}); },
  whoosh(){ noise({f:400,f2:5000,d:1.2,v:.25,ft:'bandpass',q:.8}); },
  slam(){ noise({f:1200,f2:40,d:.9,v:.5}); tone({f:90,f2:25,d:.8,v:.5,type:'sine'}); },
  hole(){ tone({f:400,f2:40,d:1.5,v:.14,type:'sawtooth',lp:900}); noise({f:300,f2:2000,d:1.2,v:.12,ft:'bandpass'}); },
  coin(){ const t=now(); tone({f:988,d:.08,v:.06,t,type:'square'}); tone({f:1319,d:.3,v:.06,t:t+.08,type:'square'}); },
  win(){ const t=now(); [60,64,67,72,67,72,76,79,84].forEach((n,i)=>{ const f=440*Math.pow(2,(n-69)/12); tone({f,d:.22,v:.07,t:t+i*.13,type:'square',lp:3500}); tone({f:f/2,d:.22,v:.05,t:t+i*.13,type:'triangle'}); }); },
};

// ================= MUSIC =================
const mf=n=>440*Math.pow(2,(n-69)/12);
const music={next:0,step:0,song:null,rate:1};
function kick(t,v=.5){ tone({f:150,f2:40,d:.22,v,t,type:'sine',sweep:.12,dest:musG}); }
function snare(t,v=.22){ noise({f:1800,d:.14,v,t,ft:'bandpass',q:.9,dest:musG}); tone({f:220,f2:120,d:.08,v:v*.4,t,type:'triangle',dest:musG}); }
function hat(t,v=.06){ noise({f:8000,d:.035,v,t,ft:'highpass',dest:musG}); }
function mkSong(o){
  return {bpm:o.bpm,len:16*o.roots.length,play(i,t,spb){
    const bar=Math.floor(i/16)%o.roots.length, st=i%16, r=o.roots[bar];
    if(o.k&&o.k[st]==='x') kick(t,o.kv??.45);
    if(o.s&&o.s[st]==='x') snare(t,o.sv??.2);
    if(o.h&&o.h[st]==='x') hat(t,o.hv??.05);
    const b=o.bass&&o.bass[st]; if(b!=null&&b!=='.') tone({f:mf(r+(+b)),d:spb*(o.bl??1.6),v:o.bv??.12,t,type:o.bt||'sawtooth',lp:o.blp??600,dest:musG});
    if(o.arp){ const a=o.arp[st%o.arp.length]; if(a!=null) tone({f:mf(r+12+a),d:spb*.9,v:o.av??.035,t,type:o.at||'square',lp:o.alp??2600,dest:musG}); }
  }};
}
const SONGS={

const WALL=1, OPEN=0, DOOR=2, PEN=3;
const MAZE1=["############################", "#.....#..............#.....#", "#.###.#.############.#.###.#", "#o###.#.############.#.###o#", "#..........................#", "#.###.##.##.####.##.##.###.#", "#.###.##.##.####.##.##.###.#", "#.....##....####....##.....#", "#####.#####.####.#####.#####", "#####.#####.####.#####.#####", "#####.##............##.#####", "#####.##.###----###.##.#####", "#####.##.#PPPPPPPP#.##.#####", "      ##.#PPPPPPPP#.##      ", "#####....#PPPPPPPP#....#####", "#####.##.##########.##.#####", "#####.##............##.#####", "#####.##.##########.##.#####", "#............##............#", "#.###.######.##.######.###.#", "#o..#........##........#..o#", "###.#.##.##########.##.#.###", "###.#.##.##########.##.#.###", "#.....##....####....##.....#", "#.#########.####.#########.#", "#.#########.####.#########.#", "#..........................#", "#.##.#####.######.#####.##.#", "#.##.#####.######.#####.##.#", "#..........................#", "############################"];
function parseMaze(rows,wrapX,wrapY){
  const H=rows.length, W=rows[0].length;
  const m={W,H,wrapX,wrapY,cell:new Uint8Array(W*H),dot:new Uint8Array(W*H),hgt:new Float32Array(W*H),solid:new Uint8Array(W*H)};
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c=rows[y][x], i=y*W+x;
    m.cell[i]=c==='#'?WALL:c==='-'?DOOR:c==='P'?PEN:OPEN;
    m.dot[i]=c==='.'?1:c==='o'?2:0;
  }
  return m;
}
// lattice city / torus generator: corridors every 4 cells, random block merges, no dead ends
function genLattice(W,H,wrap,seed,frac){
  const R=mulberry(seed), off=wrap?0:1;
  const NX=wrap?W/4:(W-3)/4+1, NY=wrap?H/4:(H-3)/4+1;
  const rows=[]; for(let y=0;y<H;y++){ let s=''; for(let x=0;x<W;x++){ const border=!wrap&&(x===0||y===0||x===W-1||y===H-1); s+=(!border&&((x-off)%4===0||(y-off)%4===0))?'.':'#'; } rows.push(s.split('')); }
  const edges=[]; // [ax,ay,bx,by]
  for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){
    if(wrap||i<NX-1) edges.push([i,j,(i+1)%NX,j,'h']);
    if(wrap||j<NY-1) edges.push([i,j,i,(j+1)%NY,'v']);
  }
  const deg=new Int32Array(NX*NY); const alive=new Set(edges.map((e,k)=>k));
  edges.forEach(e=>{deg[e[1]*NX+e[0]]++; deg[e[3]*NX+e[2]]++;});
  const connected=()=>{ const adj=Array.from({length:NX*NY},()=>[]); alive.forEach(k=>{const e=edges[k]; adj[e[1]*NX+e[0]].push(e[3]*NX+e[2]); adj[e[3]*NX+e[2]].push(e[1]*NX+e[0]);});
    const seen=new Uint8Array(NX*NY); const st=[0]; seen[0]=1; let c=1; while(st.length){ const a=st.pop(); for(const b of adj[a]) if(!seen[b]){seen[b]=1;c++;st.push(b);} } return c===NX*NY; };
  const order=edges.map((e,k)=>k).sort(()=>R()-.5);
  let target=Math.floor(edges.length*frac), removed=0;
  for(const k of order){
    if(removed>=target) break;
    const e=edges[k], a=e[1]*NX+e[0], b=e[3]*NX+e[2];
    if(deg[a]<3||deg[b]<3) continue;
    alive.delete(k); if(!connected()){ alive.add(k); continue; }
    deg[a]--; deg[b]--; removed++;
    const x0=e[0]*4+off, y0=e[1]*4+off;
    for(let s=1;s<=3;s++){ if(e[4]==='h') rows[y0][(x0+s)%W]='#'; else rows[(y0+s)%H][x0]='#'; }
  }
  return rows.map(r=>r.join(''));
}
const wrapI=(v,n)=>((v%n)+n)%n;
function cellAt(m,x,y){
  if(m.wrapX) x=wrapI(x,m.W); if(m.wrapY) y=wrapI(y,m.H);
  if(x<0||y<0||x>=m.W||y>=m.H) return WALL;
  return m.cell[y*m.W+x];
}
function idxOf(m,x,y){ if(m.wrapX) x=wrapI(x,m.W); if(m.wrapY) y=wrapI(y,m.H); if(x<0||y<0||x>=m.W||y>=m.H) return -1; return y*m.W+x; }
function wdx(m,a,b){ let d=b-a; if(m.wrapX){ if(d>m.W/2) d-=m.W; if(d<-m.W/2) d+=m.W; } return d; }
function wdy(m,a,b){ let d=b-a; if(m.wrapY){ if(d>m.H/2) d-=m.H; if(d<-m.H/2) d+=m.H; } return d; }
function bfs(m,tx,ty,pass){
  const D=new Int16Array(m.W*m.H).fill(-1); const q=[]; const s=idxOf(m,tx,ty); if(s<0) return D; D[s]=0; q.push(s);
  for(let h=0;h<q.length;h++){ const i=q[h], x=i%m.W, y=(i/m.W)|0;
    for(const [dx,dy] of DIRS){ const j=idxOf(m,x+dx,y+dy); if(j<0||D[j]>=0||!pass(m.cell[j],j)) continue; D[j]=D[i]+1; q.push(j); } }
  return D;
}
const DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
function isEdgeWall(m,x,y){
  if(cellAt(m,x,y)===OPEN) return false;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; if(cellAt(m,x+dx,y+dy)!==WALL) return true; }
  return false;
}

// ================= ACTORS =================
function wrapActor(m,a){
  if(m.wrapX){ if(a.x<-.5) a.x+=m.W; else if(a.x>=m.W-.5) a.x-=m.W; }
  if(m.wrapY){ if(a.y<-.5) a.y+=m.H; else if(a.y>=m.H-.5) a.y-=m.H; }
}
function stepActor(m,a,dist,decide){
  let g=0;
  while(dist>1e-5&&g++<40){
    const rx=Math.round(a.x), ry=Math.round(a.y);
    if(Math.abs(a.x-rx)<1e-4&&Math.abs(a.y-ry)<1e-4){
      a.x=rx; a.y=ry; wrapActor(m,a);
      if(!a.decided){ decide(a); a.decided=true; }
      if(!a.dx&&!a.dy){ a.decided=false; return; }
    }
    if(!a.dx&&!a.dy) return;
    const hz=a.dx!==0;
    if(hz) a.y=Math.round(a.y); else a.x=Math.round(a.x);
    const pos=hz?a.x:a.y, d=hz?a.dx:a.dy;
    const tgt=d>0?Math.floor(pos+1e-4)+1:Math.ceil(pos-1e-4)-1;
    const r=Math.abs(tgt-pos), mv=Math.min(r,dist);
    if(mv>=r-1e-6){ if(hz) a.x=tgt; else a.y=tgt; } else { if(hz) a.x+=d*mv; else a.y+=d*mv; }
    dist-=mv; a.decided=false;
    wrapActor(m,a);
  }
}

// first-person: hold forward to walk, turns happen on tile centres, never automatic
function fpsWalkHeld(){ return !!(keys.ArrowUp||keys.KeyW||(ptr.down&&!ptr.moved&&performance.now()-ptr.downT>230)); }
function fpsDecide(h){

function fpsHeroMove(h,sp,dt){

function heroDecide(h){
  const c=G.cfg;

  else if(c.fps&&!h.dx&&!h.dy){ if(h.wx||h.wy){ h.fx=h.wx; h.fy=h.wy; } }
  else if(!heroPass(h.x+h.dx,h.y+h.dy)){
    if(c.fps){ const opts=[[h.dy,-h.dx],[-h.dy,h.dx]].filter(d=>heroPass(h.x+d[0],h.y+d[1]));

function enTarget(e){
  const h=G.hero, m=G.m;

  const hx=Math.round(h.x), hy=Math.round(h.y), fx=h.fx, fy=h.fy;
  switch(e.pers){
    case 0: return [hx,hy];
    case 1: return [hx+fx*4,hy+fy*4];

function enDecide(e){

function buildWallCanvas(m,col,glow){
